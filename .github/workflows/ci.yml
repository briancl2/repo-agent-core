name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CLOSURE_TRIGGER: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PARENT_COMMAND: make test
          OWNER_CONVERGENCE_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: make test
